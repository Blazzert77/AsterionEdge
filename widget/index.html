<!DOCTYPE html>
<html lang="fr">
<head>
  <title>Asterion Edge</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="cockpit">
  <header class="topbar">
    <div class="brand">
      <img src="icon.svg" alt="" />
      <div class="brand-copy">
        <strong>ASTERION</strong>
        <span>EDGE / STAR CITIZEN</span>
      </div>
      <b class="version" id="versionBadge">v0.3.0</b>
    </div>

    <div class="tagline">VOTRE UNIVERS. PLUS PROCHE.</div>

    <div class="status-strip" aria-label="État du système">
      <div class="status-chip"><span>COMPANION</span><strong id="connection">DÉCONNECTÉ</strong></div>
      <div class="status-chip"><span>STAR CITIZEN</span><strong id="game">ARRÊTÉ</strong></div>
      <div class="status-chip"><span>BRANCHE</span><strong id="branchBuild">—</strong></div>
      <div class="status-chip"><span>GAME.LOG</span><strong id="logState">—</strong></div>
    </div>
    <time id="clock">00:00</time>
  </header>

  <div class="workspace">
    <aside class="rail">
      <nav id="nav"></nav>
      <div class="rail-foot">ASTERION<span>MFD LOCAL</span></div>
    </aside>

    <main>
      <div id="content"></div>
    </main>
  </div>

  <footer>
    <span id="footerStatus">AUTO-LINK · en attente du Companion</span>
    <span id="toast" role="status">Connexion locale automatique.</span>
    <button id="retryButton" class="footer-action">RECONNECTER</button>
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
