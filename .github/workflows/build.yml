name: Validate and build Asterion Edge

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript and JSON
        shell: pwsh
        run: |
          node --check widget/app.js
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript validation failed' }
          Get-Content widget/manifest.json | ConvertFrom-Json | Out-Null
          Get-Content Mappings/4.10.json | ConvertFrom-Json | Out-Null
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build tests, companion, widget and installer
        shell: pwsh
        run: ./scripts/build.ps1 -Installer
      - name: Package portable application
        shell: pwsh
        run: ./scripts/package-portable.ps1
      - name: Upload development build
        uses: actions/upload-artifact@v4
        with:
          name: AsterionEdge-${{ github.ref_name }}-${{ github.sha }}
          path: |
            release/AsterionEdge-Setup-*.exe
            release/AsterionEdge-portable-*.zip
            asterion-star-citizen-cockpit-*.icuewidget
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub prerelease
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content widget/manifest.json | ConvertFrom-Json
          $tag = "v$($manifest.version)"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; preserving published assets."
            exit 0
          }
          gh release create $tag release/AsterionEdge-Setup-*.exe release/AsterionEdge-portable-*.zip asterion-star-citizen-cockpit-*.icuewidget --target "${{ github.sha }}" --title "Asterion Edge $tag" --notes-file docs/release-design.2.md --prerelease
